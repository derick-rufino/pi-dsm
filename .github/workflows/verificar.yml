name: Verificar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nome da branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # Só avisa: não bloqueia o merge
          if ! [[ "$BRANCH" =~ ^(feat|fix|docs|dados|chore)/[a-z0-9-]+$ ]]; then
            echo "::warning::Branch '$BRANCH' fora do padrão. Prefira feat/, fix/, docs/, dados/ ou chore/ seguido de palavras-com-hifen."
          fi

      - name: JSON válido
        run: |
          shopt -s nullglob
          for f in dados/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::JSON inválido"; exit 1; }
          done

      - name: Regras do projeto
        run: bash scripts/verificar-regras.sh
